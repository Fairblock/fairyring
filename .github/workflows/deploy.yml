name: Restart Fairyring

on:
  push:
    branches: ["anonymous-transfer"]
  pull_request:
    branches: ["anonymous-transfer"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test ./... -cover -timeout 8m

  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

  restart-fairyring:
    name: Restart Fairyring
    runs-on: ubuntu-latest
    needs: [tests, style]
    if: github.event_name == 'push'
    steps:
      - name: SSH and Restart Fairyring
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: mani
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd /home/mani/fairyring
            git pull origin anonymous-transfer
            make devnet-down
            make devnet-up

  deploy-contracts:
    name: Deploy Contracts
    runs-on: ubuntu-latest
    needs: restart-fairyring
    if: github.event_name == 'push'
    steps:
      - name: SSH and Deploy Contracts
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: mani
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            /home/mani/scripts/deploy-contracts.sh

  restart-fairyport:
    name: Restart Fairyport
    runs-on: ubuntu-latest
    needs: deploy-contracts
    if: github.event_name == 'push'
    steps:
      - name: SSH and Restart Fairyport
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: mani
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            /home/mani/scripts/deploy-fairyport.sh
