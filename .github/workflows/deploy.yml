name: Restart Fairyring

on:
  push:
    branches: ["anonymous-transfer"]
  pull_request:
    branches: ["anonymous-transfer"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test ./... -cover -timeout 8m

  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      # exclude api/ (generated protobuf); suppress doc/naming style checks (ST1000/ST1003/ST1020/ST1021)
      # and deprecated-usage noise in generated .pb.gw.go files (SA1019)
      - run: staticcheck -checks "all,-SA1019,-ST1000,-ST1003,-ST1020,-ST1021" $(go list ./... | grep -v 'fairyring/api')

  restart-fairyring:
    name: Restart Fairyring
    runs-on: ubuntu-latest
    needs: [tests, style]
    if: github.event_name == 'push'
    steps:
      - name: SSH and Restart Fairyring
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: mani
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            /home/mani/scripts/deploy-fairyring.sh

  deploy-contracts:
    name: Deploy Contracts
    runs-on: ubuntu-latest
    needs: restart-fairyring
    if: github.event_name == 'push'
    steps:
      - name: SSH and Deploy Contracts
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: mani
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            /home/mani/scripts/deploy-contracts.sh

  restart-fairyport:
    name: Restart Fairyport
    runs-on: ubuntu-latest
    needs: deploy-contracts
    if: github.event_name == 'push'
    steps:
      - name: SSH and Restart Fairyport
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: mani
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            /home/mani/scripts/deploy-fairyport.sh
