syntax = "proto3";

package fairyring.zkp;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "fairyring/zkp/params.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/Fairblock/fairyring/x/zkp/types";

service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a governance operation for updating the module parameters.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc AddTrustedContract(MsgAddTrustedContract) returns (MsgAddTrustedContractResponse);
  rpc RemoveTrustedContract(MsgRemoveTrustedContract) returns (MsgRemoveTrustedContractResponse);
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "fairyring/x/zkp/MsgUpdateParams";

  // authority is the address that currently controls the module.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message MsgUpdateParamsResponse {}

message MsgAddTrustedContract {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string contract_address = 2;
}

message MsgAddTrustedContractResponse {}

message MsgRemoveTrustedContract {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string contract_address = 2;
}

message MsgRemoveTrustedContractResponse {}
